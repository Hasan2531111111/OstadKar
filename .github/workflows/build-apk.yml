name: Build Signed Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode keystore
        run: |
          mkdir -p keystore
          if [ -f keystore/ostadkar-release.keystore.b64 ]; then
            base64 -d keystore/ostadkar-release.keystore.b64 > keystore/ostadkar-release.keystore
          fi
          ls -la keystore/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK packages
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          SM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SM"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Signed Release APK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          gradle assembleRelease --stacktrace --no-daemon

      - name: List APK
        run: find app/build/outputs -name "*.apk" -ls || true

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: OstadKar-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
